# Render blueprint for the backend. Secrets use sync: false, so Render asks
# for them in the dashboard; nothing secret lives in this file.
services:
  - type: web
    name: negotiator-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: negotiator
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      # Your Vercel production URL (and later the .xyz domain), comma-separated.
      - key: CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview deployments, e.g.
      # ^https://negotiator-[a-z0-9-]+\.vercel\.app$
      - key: CORS_ORIGIN_REGEX
        sync: false
